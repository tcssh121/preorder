<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>園遊會預購系統</title>

<style>
body{
  margin:0;
  padding:0.5rem;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
  background:#f4f6fb;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.card{
  width:90%;
  max-width:480px;
  background:white;
  padding:1.5rem;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  margin-top:2rem;
}

h2{text-align:center}

label{display:block;margin-top:0.8rem}

input,select{
  width:100%;
  padding:0.55rem;
  margin-top:0.3rem;
  font-size:1rem;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

input::placeholder{color:#aaa}

select{color:#aaa}
select:valid{color:#000}

button{
  margin-top:1rem;
  width:100%;
  padding:0.8rem;
  border:none;
  border-radius:8px;
  background:#4f46e5;
  color:white;
  font-size:1rem;
  cursor:pointer;
}

.hidden{display:none}

/* 後台表格顯示一行 */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:1rem;
  font-size:0.85rem;
  word-break:break-word;
  display:block;
  overflow-x:auto;
}
th, td{
  border:1px solid #ccc;
  padding:0.4rem;
  text-align:center;
  white-space: nowrap;
}

/* 後台按鈕置中並跟隨內容 */
#adminBtn{
  position: static;
  margin: 1rem auto 0 auto;
  display: block;
  background: transparent;
  border: none;
  color: #555;
  font-size: 0.85rem;
  cursor: pointer;
}

/* 版權訊息置中並跟隨內容 */
#creator{
  position: static;
  margin: 0.5rem auto;
  text-align: center;
  font-size: 0.65rem;
  color: #888;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>
<img src="images/logo.jpg" alt="宣傳單" class="page-image">
<div class="card" id="formPage">
<h2>園遊會預購</h2>

<label>是否台中二中在校生
<select id="school" required>
  <option value="" disabled selected>請選擇</option>
  <option value="是">是</option>
  <option value="否">否</option>
</select>
</label>

<label>學號<input id="sid" placeholder="若非在校生或老師請填 000000" maxlength="6"></label>
<label>班級<input id="cls" placeholder="若非在校生或老師請填 000" maxlength="3"></label>
<label>姓名<input id="nameInput"></label>
<label>聯絡方式
<input id="contact" placeholder="可聯絡用電話號碼">
</label>

<label>鬆餅（30 元）<input type="number" id="w" value="0" min="0"></label>
<label>泰式奶茶（60 元）<input type="number" id="m" value="0" min="0"></label>

<p>總價：<span id="total">0</span> 元</p>
<button onclick="submitOrder()">送出訂單</button>
</div>

<div class="card hidden" id="adminPage">
<h2>後台訂單</h2>
<table>
<thead>
<tr><th>姓名</th><th>學號</th><th>班級</th><th>在校生</th><th>聯絡</th><th>內容</th><th>金額</th><th>刪除</th></tr>
</thead>
<tbody id="orders"></tbody>
</table>
<button onclick="logout()">登出後台</button>
</div>

<button id="adminBtn" onclick="loginAdmin()">後台登入</button>
<div id="creator">Copyright© 2025 Kenny L. All rights reserved</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAkmQpNqBYiATO0LuYGRTJSHr5txshndGE",
  authDomain: "preorder-system-5d0e8.firebaseapp.com",
  projectId: "preorder-system-5d0e8",
  storageBucket: "preorder-system-5d0e8.firebasestorage.app",
  messagingSenderId: "1053091124424",
  appId: "1:1053091124424:web:231ee6e31d8694a81fc1fd"
});
const db = firebase.firestore();
const PASSWORD_HASH = "e059dc647c2c355779ee6c9bb0c0597e4e0a4cfd90544386febb8dcdf9a75d3f";

async function sha256(t){
  const e = new TextEncoder().encode(t);
  const b = await crypto.subtle.digest("SHA-256", e);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}


// DOM 元素
const sid = document.getElementById("sid");
const cls = document.getElementById("cls");
const nameInput = document.getElementById("nameInput");
const school = document.getElementById("school");
const contact = document.getElementById("contact");
const wInput = document.getElementById("w");
const mInput = document.getElementById("m");
const total = document.getElementById("total");
const formPage = document.getElementById("formPage");
const adminPage = document.getElementById("adminPage");
const orders = document.getElementById("orders");

// 計算總價
function calc(){
  const w = parseInt(wInput.value) || 0;
  const m = parseInt(mInput.value) || 0;
  const c = Math.min(w, m);
  total.textContent = c*80 + (w-c)*30 + (m-c)*60;
}
wInput.oninput = mInput.oninput = calc;

// 送出訂單
function submitOrder(){
  const sidVal = sid.value.trim();
  const clsVal = cls.value.trim();
  const nameVal = nameInput.value.trim();
  const schoolVal = school.value;
  const contactVal = contact.value.trim();

  let errors = [];

  if(!nameVal) errors.push("請填寫姓名");
  if(!contactVal) errors.push("請填寫聯絡方式");
  if(!schoolVal) errors.push("請選擇是否在校生");

  if(schoolVal === "是"){
    if(!/^\d{6}$/.test(sidVal)) errors.push("在校生學號需為 6 碼數字");
    if(!/^\d{3}$/.test(clsVal)) errors.push("在校生班級需為 3 碼數字");
  }

  const w = parseInt(wInput.value) || 0;
  const m = parseInt(mInput.value) || 0;
  if(w + m === 0) errors.push("請選擇商品");

  if(errors.length > 0) return alert(errors.join("\n"));

  const c = Math.min(w, m);
  const price = c*80 + (w-c)*30 + (m-c)*60;

  db.collection("orders").add({
    sid: sidVal || "000000",
    cls: clsVal || "000",
    name: nameVal,
    school: schoolVal,
    contact: contactVal,
    w, m, price,
    time: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    alert("送出成功，總價 "+price+" 元");
    document.querySelectorAll("input").forEach(i=>i.value="");
    school.value="";
    wInput.value = mInput.value = 0;
    calc();
  });
}

// 後台登入
async function loginAdmin(){
  const pw = prompt("輸入後台密碼");
  if(!pw) return;
  if(await sha256(pw) !== PASSWORD_HASH) return alert("密碼錯誤");

  formPage.classList.add("hidden");
  adminPage.classList.remove("hidden");

  // 登入後隱藏後台按鈕
  document.getElementById("adminBtn").style.display = "none";

  loadOrders();
}

// 登出
function logout(){
  adminPage.classList.add("hidden");
  formPage.classList.remove("hidden");
  // 登出後顯示後台按鈕
  document.getElementById("adminBtn").style.display = "block";
}

// 載入訂單
function loadOrders(){
  db.collection("orders").get().then(s=>{
    orders.innerHTML = "";
    s.forEach(d=>{
      const o = d.data();
      orders.innerHTML += `
      <tr>
        <td>${o.name}</td>
        <td>${o.sid}</td>
        <td>${o.cls}</td>
        <td>${o.school}</td>
        <td>${o.contact}</td>
        <td>鬆餅${o.w} 泰奶${o.m}</td>
        <td>${o.price}</td>
        <td><button onclick="del('${d.id}')">✕</button></td>
      </tr>`;
    });
  });
}

// 刪除訂單
function del(id){
  if(confirm("確定刪除？"))
    db.collection("orders").doc(id).delete().then(loadOrders);
}
</script>

</body>
</html>
