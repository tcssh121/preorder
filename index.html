<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>園遊會預購系統</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      padding: 1rem;
      margin: 0;
    }

    /* 表單卡片 */
    .card {
      max-width: 480px;
      width: 90%; /* 手機縮小自動縮放 */
      margin: 5rem auto 2rem auto; /* 上方留空間給齒輪 */
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 0.6rem 1.5rem rgba(0,0,0,0.08);
    }

    h2 { text-align: center; }

    label {
      display: block;
      margin-top: 0.8rem;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.3rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .hidden { display: none; }

    table {
      width: 100%;
      margin-top: 0.8rem;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 0.4rem;
      text-align: center;
      font-size: 0.9rem;
    }

    /* 中央透明齒輪 */
    #adminGear {
      position: fixed;
      top: 0.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      background: transparent; /* 透明背景 */
      color: #333; /* 符號顏色 */
      border: none;
      cursor: pointer;
      z-index: 1000;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- 中央透明齒輪後台登入按鈕 -->
<button id="adminGear" onclick="loginAdmin()">⚙️</button>

<div class="card" id="formPage">
  <h2>園遊會預購</h2>

  <label>學號<input id="sid"></label>
  <label>班級<input id="cls"></label>
  <label>姓名<input id="name"></label>

  <label>鬆餅（30元）<input type="number" id="w" value="0" min="0"></label>
  <label>泰奶（60元）<input type="number" id="m" value="0" min="0"></label>

  <p>總價：<span id="totalPrice">0 元</span></p>

  <button onclick="submitOrder()">送出訂單</button>
</div>

<div class="card hidden" id="adminPage">
  <h2>後台統計</h2>
  <table>
    <thead>
      <tr><th>姓名</th><th>內容</th><th>金額</th><th>操作</th></tr>
    </thead>
    <tbody id="orders"></tbody>
  </table>
  <button onclick="logoutAdmin()">登出後台</button>
</div>

<script>
  // 🔹 Firebase Config (換成你自己的)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const PASSWORD = '1234'; // 後台密碼，可改

  // 計算總價即時顯示
  function calcTotal() {
    const w = +document.getElementById('w').value;
    const m = +document.getElementById('m').value;
    const combo = Math.min(w, m); // 套餐數量
    const total = combo * 80 + (w - combo) * 30 + (m - combo) * 60;

    let breakdown = '';
    if (combo > 0) breakdown += `套餐 x ${combo} = ${combo*80} 元, `;
    if (w - combo > 0) breakdown += `鬆餅 x ${w - combo} = ${(w-combo)*30} 元, `;
    if (m - combo > 0) breakdown += `泰奶 x ${m - combo} = ${(m-combo)*60} 元`;

    document.getElementById('totalPrice').textContent = `${total} 元 (${breakdown})`;
  }

  document.getElementById('w').addEventListener('input', calcTotal);
  document.getElementById('m').addEventListener('input', calcTotal);
  calcTotal();

  // 送單
  function submitOrder() {
    const sid = document.getElementById('sid').value;
    const cls = document.getElementById('cls').value;
    const name = document.getElementById('name').value;
    const w = +document.getElementById('w').value;
    const m = +document.getElementById('m').value;

    if (!sid || !cls || !name || (w===0 && m===0)) {
      return alert('請填寫完整資料或選擇商品');
    }

    const combo = Math.min(w, m);
    const total = combo * 80 + (w - combo) * 30 + (m - combo) * 60;

    db.collection('orders').add({
      sid, cls, name,
      w, m, total,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      alert(`訂單送出成功！總價 ${total} 元`);
      document.getElementById('sid').value = '';
      document.getElementById('cls').value = '';
      document.getElementById('name').value = '';
      document.getElementById('w').value = 0;
      document.getElementById('m').value = 0;
      calcTotal();
    }).catch(err => {
      console.error(err);
      alert('送單失敗，請再試一次');
    });
  }

  // 後台登入
  function loginAdmin() {
    const pw = prompt('輸入後台密碼');
    if (pw !== PASSWORD) return alert('密碼錯誤');
    document.getElementById('formPage').classList.add('hidden');
    document.getElementById('adminPage').classList.remove('hidden');
    loadOrders();
  }

  function logoutAdmin() {
    document.getElementById('formPage').classList.remove('hidden');
    document.getElementById('adminPage').classList.add('hidden');
  }

  // 後台載入訂單
  function loadOrders() {
    db.collection('orders').orderBy('timestamp')
      .get()
      .then(snapshot => {
        const tbody = document.getElementById('orders');
        tbody.innerHTML = '';
        snapshot.forEach(doc => {
          const o = doc.data();
          tbody.innerHTML += `<tr>
            <td>${o.name}</td>
            <td>鬆餅${o.w} 泰奶${o.m}</td>
            <td>${o.total}</td>
            <td><button onclick="deleteOrder('${doc.id}')">刪除</button></td>
          </tr>`;
        });
      });
  }

  // 刪除訂單
  function deleteOrder(id) {
    if(!confirm('確定要刪除這筆訂單嗎？')) return;
    db.collection('orders').doc(id).delete()
      .then(() => {
        alert('刪除成功');
        loadOrders(); // 刷新列表
      })
      .catch(err => {
        console.error(err);
        alert('刪除失敗');
      });
  }
</script>

</body>
</html>
